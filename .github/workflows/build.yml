name: 自动打包 Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller 打包（文件夹版）
        run: pyinstaller FastGithubPy.spec --noconfirm

      - name: PyInstaller 打包（单文件版）
        run: pyinstaller FastGithubPy-onefile.spec --noconfirm --workpath build_onefile --distpath dist_onefile

      - name: 整理产物
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/FastGithubPy/*" -DestinationPath "FastGithubPy-windows.zip" -Force
          Copy-Item "dist_onefile/FastGithubPy.exe" "FastGithubPy.exe" -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: FastGithubPy-windows
          path: |
            FastGithubPy-windows.zip
            FastGithubPy.exe
          if-no-files-found: error
          retention-days: 90

      - name: 发布 / 更新「最新构建」Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建（自动更新）
          body: |
            每次 push 自动更新的最新构建，两个版本任选其一：
            - `FastGithubPy.exe` —— 单文件版，双击即用（启动约慢几秒）
            - `FastGithubPy-windows.zip` —— 文件夹版，解压后运行，启动更快
            提交：`${{ github.sha }}`
            时间：`${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}`
          files: |
            FastGithubPy-windows.zip
            FastGithubPy.exe
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: 发布版本 Release（推送 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            FastGithubPy-windows.zip
            FastGithubPy.exe
          fail_on_unmatched_files: true
